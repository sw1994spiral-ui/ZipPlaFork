# 配置先: リポジトリの .github/workflows/build.yml
# windows-latest 上で MSBuild を使い、AutoBuild 構成でビルドして成果物 (exe 一式) を artifact 化する。
# v3: FrameworkPathOverride のパスを Actions 式 ${{ github.workspace }} で渡す（v2 の %GITHUB_WORKSPACE% は pwsh で展開されず MSB3644 が再発したため）。
name: build-zippla-dark

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Fetch .NET Framework 4.5.2 reference assemblies
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.NETFramework.ReferenceAssemblies.net452/1.0.3" -OutFile refasm.zip
          Expand-Archive -Path refasm.zip -DestinationPath refasm

      - name: Build (AutoBuild)
        run: msbuild source\ZipPla.sln /p:Configuration=AutoBuild /p:Platform="Any CPU" /p:FrameworkPathOverride="${{ github.workspace }}\refasm\build\.NETFramework\v4.5.2" /m

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZipPla-dark
          path: source/ZipPla/bin/AutoBuild/
