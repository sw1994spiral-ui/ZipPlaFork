# 配置先: リポジトリの .github/workflows/build.yml
# windows-latest 上で MSBuild を使い、AutoBuild 構成でビルドして成果物 (exe 一式) を artifact 化する。
name: build-zippla-dark

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 単一プロジェクト構成で packages.config は無いため NuGet リストアは不要。
      # Pre/PostBuildEvent の cscript (JScript 前後処理) は Windows 標準機能のためランナー上でそのまま動く。
      - name: Build (AutoBuild)
        run: msbuild source\ZipPla.sln /p:Configuration=AutoBuild /p:Platform="Any CPU" /m

      # もし MSB3644 (.NET Framework 4.5.2 の参照アセンブリが見つからない) が出た場合は、
      # 以下の2ステップのコメントを外し、msbuild に /p:FrameworkPathOverride を追加すること。
      # - name: Fetch .NET Framework 4.5.2 reference assemblies
      #   run: nuget install Microsoft.NETFramework.ReferenceAssemblies.net452 -Version 1.0.3 -OutputDirectory refasm
      # その場合の Build コマンド:
      #   msbuild source\ZipPla.sln /p:Configuration=AutoBuild /p:Platform="Any CPU" /p:FrameworkPathOverride="%GITHUB_WORKSPACE%\refasm\Microsoft.NETFramework.ReferenceAssemblies.net452.1.0.3\build\.NETFramework\v4.5.2" /m

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZipPla-dark
          path: source/ZipPla/bin/AutoBuild/
